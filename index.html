<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>劇団DXポータル - 公演管理システム</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ja.js"></script>

    <style>
        :root { 
            --base-bg: #F1F5F9;       --main-dark: #0F172A;     --accent-blue: #2563EB;   
            --text-main: #334155;     --white: #ffffff;         --green-success: #059669;
            --border-color: #E2E8F0;  --purple: #7C3AED;
        }

        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: var(--base-bg); color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        /* セクション管理 */
        .page { display: none; animation: fadeIn 0.3s ease-in-out; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: var(--white); padding: 25px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; border: 1px solid var(--border-color); }
        h1 { text-align: center; color: var(--main-dark); font-size: 1.8rem; margin-bottom: 30px; }
        h2 { border-left: 5px solid var(--accent-blue); padding-left: 15px; font-size: 1.2rem; margin-bottom: 20px; }

        /* ボタン・入力UI */
        .btn { padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; text-decoration: none; display: inline-block; text-align: center; }
        .btn-primary { background: var(--accent-blue); color: white; }
        .btn-success { background: var(--green-success); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }

        input[type="text"], select { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; box-sizing: border-box; font-size: 1rem; }

        /* プロジェクト選択画面 */
        .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .project-card { background: white; padding: 20px; border-radius: 12px; border: 2px solid transparent; cursor: pointer; transition: 0.3s; text-align: center; }
        .project-card:hover { border-color: var(--accent-blue); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .project-card h3 { margin: 0 0 10px 0; color: var(--main-dark); }

        /* スピナー */
        #loader { display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.8); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--accent-blue); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 出欠テーブル */
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border: 1px solid var(--border-color); text-align: center; }
        th { background: #F8FAFC; font-size: 0.8rem; }
        .cell-ok { color: var(--accent-blue); font-weight: bold; }
        .cell-ng { color: #EF4444; font-weight: bold; }

        /* モード切替タブ */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; background: #E2E8F0; border-radius: 8px; cursor: pointer; font-weight: bold; text-align: center; }
        .tab-btn.active { background: var(--main-dark); color: white; }
    </style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <p>通信中...</p>
</div>

<div class="container">
    <h1>🎭 劇団スケジュール調整ポータル</h1>

    <!-- 1. プロジェクト選択画面 -->
    <div id="page-projects" class="page active">
        <div class="card">
            <h2>公演（プロジェクト）を選択</h2>
            <div class="project-grid" id="projectList">
                <!-- ここに既存のシートが並ぶ -->
            </div>
            <hr style="margin: 30px 0; border: 0; border-top: 1px solid #ddd;">
            <h2>新しい公演を作成</h2>
            <div style="display:flex; gap:10px;">
                <input type="text" id="newProjectName" placeholder="例：2026年夏公演">
                <button class="btn btn-primary" onclick="createNewProject()">作成</button>
            </div>
        </div>
    </div>

    <!-- 2. メイン操作画面（演出・役者共通） -->
    <div id="page-main" class="page">
        <div style="margin-bottom: 20px;">
            <button class="btn btn-outline" onclick="showPage('projects')">← 公演選択に戻る</button>
            <span id="currentProjectTitle" style="margin-left: 15px; font-weight: bold; font-size: 1.2rem;"></span>
        </div>

        <div class="tabs">
            <div id="tab-member" class="tab-btn active" onclick="switchMode('member')">役者：出欠回答</div>
            <div id="tab-admin" class="tab-btn" onclick="switchMode('admin')">演出：設定・管理</div>
        </div>

        <!-- 役者モード -->
        <div id="mode-member" class="mode-content">
            <div class="card">
                <h2>自分の出欠を入力する</h2>
                <input type="text" id="memberName" placeholder="あなたの名前を選択または入力" list="castOptions">
                <datalist id="castOptions"></datalist>
                <div id="dateForms" style="margin-top:20px;"></div>
                <button class="btn btn-success" style="width:100%; margin-top:20px;" onclick="submitData()">回答を送信する</button>
            </div>
        </div>

        <!-- 演出モード -->
        <div id="mode-admin" class="mode-content" style="display:none;">
            <div class="card">
                <h2>メンバー・シーン・日程の設定</h2>
                <p style="font-size: 0.8rem; color: #666;">※ここでの変更は「保存」を押すまでサーバーに反映されません。</p>
                <!-- 役者登録UIなどは簡略化してここに入れます -->
                <button class="btn btn-primary" onclick="syncSettings()">現在の設定をサーバーに保存</button>
            </div>
        </div>

        <!-- 出欠まとめ（常に表示） -->
        <div class="card">
            <h2>現在の出欠状況</h2>
            <div class="table-wrapper">
                <table id="resTable">
                    <thead id="tHead"></thead>
                    <tbody id="tBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // --- 【重要】あなたのGAS URLをここに貼ってください ---
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwBEg8Ibp65FT0sgdkOnsz8pVQXUAMEVdKwYPnHBu059-IdZIOnLfuzCklrubSnJQ_Log/exec";

    let currentProject = "";
    let projects = [];
    let responses = [];

    // 起動時：プロジェクト一覧を取得
    window.onload = async function() {
        toggleLoader(true);
        try {
            const res = await fetch(GAS_URL);
            const data = await res.json();
            projects = data.existingProjects || [];
            renderProjectList();
        } catch (e) {
            alert("通信失敗。GASの設定を確認してください。");
        }
        toggleLoader(false);
    };

    function toggleLoader(show) {
        document.getElementById('loader').style.display = show ? 'flex' : 'none';
    }

    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('page-' + pageId).classList.add('active');
    }

    function renderProjectList() {
        const list = document.getElementById('projectList');
        list.innerHTML = projects.map(p => `
            <div class="project-card" onclick="selectProject('${p}')">
                <h3>📂 ${p}</h3>
                <span class="btn btn-outline" style="padding:5px 10px; font-size:0.8rem;">開く</span>
            </div>
        `).join('');
    }

    function createNewProject() {
        const name = document.getElementById('newProjectName').value.trim();
        if (!name) return alert("公演名を入れてください");
        selectProject(name);
    }

    async function selectProject(name) {
        currentProject = name;
        document.getElementById('currentProjectTitle').innerText = "公演： " + name;
        showPage('main');
        // 本来はここでシート別のデータを取得しますが、今回は簡易化のため初期化
        renderDateFormsPlaceholder(); 
    }

    function switchMode(mode) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + mode).classList.add('active');
        document.querySelectorAll('.mode-content').forEach(c => c.style.display = 'none');
        document.getElementById('mode-' + mode).style.display = 'block';
    }

    // 回答送信処理
    async function submitData() {
        const name = document.getElementById('memberName').value.trim();
        if (!name) return alert("名前を入れてください");
        
        toggleLoader(true);
        const record = {
            projectName: currentProject,
            name: name,
            answers: {
                "5/15": { status: "参加" }, // 本来は入力UIから取得
                "5/16": { status: "不参加" }
            }
        };

        try {
            await fetch(GAS_URL, { method: "POST", body: JSON.stringify(record) });
            alert("送信完了！");
            // 送信後、自動で表までスクロール
            document.getElementById('resTable').scrollIntoView({ behavior: 'smooth' });
            // データを再読込（本来はdoGetで最新のresponsesを取得）
        } catch (e) {
            alert("送信失敗");
        }
        toggleLoader(false);
    }

    // 簡易的な日付フォーム表示（プロトタイプ用）
    function renderDateFormsPlaceholder() {
        const div = document.getElementById('dateForms');
        div.innerHTML = `
            <div style="background:#f9f9f9; padding:10px; border-radius:8px; margin-bottom:10px;">
                <strong>5/15 (金)</strong> 18:00〜21:00 <br>
                <select><option>参加</option><option>不参加</option><option>途中</option></select>
            </div>
            <div style="background:#f9f9f9; padding:10px; border-radius:8px;">
                <strong>5/16 (土)</strong> 13:00〜17:00 <br>
                <select><option>参加</option><option>不参加</option><option>途中</option></select>
            </div>
        `;
    }
</script>
</body>
</html>
